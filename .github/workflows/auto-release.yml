name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/ha_solarmax/manifest.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version aus manifest.json auslesen
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/ha_solarmax/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prüfen, ob der Tag bereits existiert
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release-Notes aus CHANGELOG.md extrahieren
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (p) exit; if ($0 ~ ("^## \\[" ver "\\]")) { p=1 }; next }
            p { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > RELEASE_NOTES.md

          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^v${VERSION}$" | head -n1 || true)
          if [ -n "$PREV_TAG" ]; then
            {
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION}"
            } >> RELEASE_NOTES.md
          fi

      - name: Tag und Release erstellen
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md

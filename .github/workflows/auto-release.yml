name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/ha_solarmax/manifest.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version aus manifest.json auslesen
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/ha_solarmax/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prüfen, ob der Tag bereits existiert
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag und Release erstellen
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 🚀 Neue Funktionen
      labels:
        - feature
        - enhancement
    - title: 🐛 Fehlerbehebungen
      labels:
        - fix
        - bug
    - title: 📚 Dokumentation
      labels:
        - documentation
    - title: 🧹 Sonstiges
      labels:
        - "*"

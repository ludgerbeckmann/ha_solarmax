[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solarmax-ha-integration"
version = "0.6.0"
description = "Home Assistant integration for Solarmax solar inverters"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Ludger Beckmann", email = "ludgerbeckmann@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/ludgerbeckmann/ha_solarmax"
"Bug Reports" = "https://github.com/ludgerbeckmann/ha_solarmax/issues"
"Source" = "https://github.com/ludgerbeckmann/ha_solarmax"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "G",   # flake8-logging-format
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Dev/debug scripts: lazy logging and line length are not worth enforcing
"tools/*" = ["G004", "E501", "E402"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
